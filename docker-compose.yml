## Requires Docker Compose 2.24 or later (`docker compose version`) — the long-form env_file entries below need it.
##
## Crow — Docker Compose
##
## Cloud deployment:
##   docker compose --profile cloud --profile storage up --build
##
## Local with Cloudflare Tunnel:
##   docker compose --profile local --profile storage up --build
##
## Object storage (default) is Garage:
##   docker compose --profile storage up   # garage
##
## Profiles:
##   cloud, local   — the gateway (crow-gateway); `local` also starts the Cloudflare tunnel
##   storage        — Garage, the default S3-compatible object storage
##   minio-legacy   — MinIO, for existing deployments only (see the service comment)
##
## Keeping an existing MinIO install running (no data change):
##   docker compose --profile cloud --profile minio-legacy up --build
##
## Two environment files, and which service reads which:
##   .env         — crow-gateway (and tunnel): Crow's own settings, including the
##                  S3_ENDPOINT / S3_ACCESS_KEY / S3_SECRET_KEY the gateway reaches
##                  object storage with. Copy it from .env.example.
##   .env.garage  — the garage service and its one-shot garage-preflight check: its
##                  five GARAGE_* secrets, read through that service's own env_file.
##                  Copy it from .env.garage.example.
##
## Garage's admin token, RPC secret and metrics token must never reach the gateway. The
## gateway only ever talks to Garage over S3, with the one key pair in S3_* (the same
## rule the File Storage (Garage) extension follows — see tests/garage-bundle.test.js),
## so no GARAGE_* reference appears in any service other than garage / garage-preflight.
##
## Required keys — only for the profile you actually start. Compose interpolates EVERY
## service in this file, including the ones whose profile is off, so a required variable
## reference (a `:?` with an error message) would make an unrelated profile fail before
## any container starts. Hence no `:?` anywhere below, and a start-time check inside the
## container for every required value:
##   storage        — .env.garage: GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN,
##                    GARAGE_METRICS_TOKEN, GARAGE_DEFAULT_ACCESS_KEY,
##                    GARAGE_DEFAULT_SECRET_KEY. The one-shot garage-preflight service
##                    checks all five and exits 78; garage waits for it, so a blank or
##                    malformed value stops the storage profile before Garage starts.
##   minio-legacy   — MINIO_ROOT_PASSWORD in .env. The service's own entrypoint refuses
##                    a blank, default (`minioadmin`) or too-short password (exit 78),
##                    so MinIO never falls back to its published default credentials.

services:
  crow-gateway:
    build: .
    ports:
      - "127.0.0.1:${CROW_GATEWAY_PORT:-3001}:3001"
    volumes:
      - ${CROW_DATA_DIR:-./data}:/app/data
    env_file: .env
    environment:
      - CROW_TRANSPORT=http
      - CROW_GATEWAY_PORT=3001
      - CROW_DB_PATH=/app/data/crow.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: [cloud, local]

  garage:
    # Default object storage: Garage (S3-compatible). Same image, command, secrets and
    # healthcheck as the File Storage (Garage) extension (bundles/garage) — the bundle
    # passes the five GARAGE_* values through `environment:`, this service through the
    # env file below — so an Extensions install and this profile behave identically. The
    # gateway reaches it at S3_ENDPOINT=garage:3900 (see .env.example) with the key
    # created on first start by --default-access-key.
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ["/garage", "server", "--single-node", "--default-access-key"]
    # Garage's five secrets (RPC secret, admin token, metrics token, and the S3 key
    # pair) come from its OWN env file — never from .env, which the gateway loads.
    # The gateway must never hold the cluster admin token or the RPC secret; it gets
    # S3_ACCESS_KEY / S3_SECRET_KEY only. `required: true` (long form, Compose Spec)
    # makes a missing .env.garage a plain error instead of a Garage that starts with
    # no secrets. Nothing else is passed in: the non-secret settings live in the
    # mounted garage.toml, so this service needs no `environment:` block at all.
    # A BLANK value in that file is caught by garage-preflight, below: Garage has no
    # shell, so the check cannot run in this image.
    env_file:
      - path: .env.garage
        required: true
    depends_on:
      garage-preflight:
        condition: service_completed_successfully
    volumes:
      # The extension's own rendered config, mounted read-only rather than copied:
      # one file keeps the bundle install and this profile from drifting apart.
      - ./bundles/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    # S3 API 3900 stays on the compose network (the gateway dials "garage") and
    # RPC 3901 is never published; only the admin API is reachable, from loopback.
    expose:
      - "3900"
    ports:
      - "127.0.0.1:3903:3903"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles: [storage]

  garage-preflight:
    # One-shot gate for `--profile storage`, started by the same env file as garage.
    # Garage's image has no shell, so the check runs beside it in busybox: every one
    # of the five GARAGE_* values must be present and in the format the manifest's
    # generators produce (bundles/garage/manifest.json → the generate rules in
    # servers/gateway/bundle-env-secrets.js):
    #   hex32          → 64 hex characters (GARAGE_RPC_SECRET, GARAGE_DEFAULT_SECRET_KEY)
    #   garage_key_id  → "GK" + 24 hex characters (GARAGE_DEFAULT_ACCESS_KEY)
    #   secret         → 43 base64url characters (GARAGE_ADMIN_TOKEN, GARAGE_METRICS_TOKEN)
    # Garage accepts any string as a token, so for those two a long random string is
    # enough (the documented `openssl rand -hex 32` gives 64 hex, which also passes).
    # Anything blank or not in format stops the profile here — exit 78 (EX_CONFIG) and
    # one line on stderr naming the variable — and `garage` never starts, because it
    # depends on this service completing successfully.
    # Every `$` in the script is written `$$`: Compose turns that into a literal `$` and
    # leaves the shell to expand it.
    image: busybox:1.38.0
    env_file:
      - path: .env.garage
        required: true
    command:
      - /bin/sh
      - -c
      - |
        fail() {
          echo "garage-preflight: $$1 is empty or malformed - fix it in .env.garage (formats in .env.garage.example)" >&2
          exit 78
        }
        hex32() {  # name value: 64 hex characters
          v=$$2
          [ -n "$$v" ] || fail "$$1"
          [ "$${#v}" -eq 64 ] || fail "$$1"
          case "$$v" in *[!0-9a-fA-F]*) fail "$$1" ;; esac
        }
        key_id() {  # name value: GK + 24 hex characters
          v=$$2
          [ -n "$$v" ] || fail "$$1"
          [ "$${#v}" -eq 26 ] || fail "$$1"
          case "$$v" in GK*) ;; *) fail "$$1" ;; esac
          case "$${v#GK}" in *[!0-9a-fA-F]*) fail "$$1" ;; esac
        }
        long_token() {  # name value: a long random string
          v=$$2
          [ "$${#v}" -ge 32 ] || fail "$$1"
        }
        hex32 GARAGE_RPC_SECRET "$$GARAGE_RPC_SECRET"
        hex32 GARAGE_DEFAULT_SECRET_KEY "$$GARAGE_DEFAULT_SECRET_KEY"
        key_id GARAGE_DEFAULT_ACCESS_KEY "$$GARAGE_DEFAULT_ACCESS_KEY"
        long_token GARAGE_ADMIN_TOKEN "$$GARAGE_ADMIN_TOKEN"
        long_token GARAGE_METRICS_TOKEN "$$GARAGE_METRICS_TOKEN"
        echo "garage-preflight: .env.garage holds all five GARAGE_* values"
    restart: "no"
    profiles: [storage]

  minio:
    # LEGACY — for existing deployments only. MinIO's public images are no longer published
    # (Docker Hub and Quay refuse anonymous pulls as of 2026-11-05), so a fresh
    # `docker compose up` cannot fetch this one. New deployments use `--profile storage`
    # (Garage). Keeping MinIO means `--profile minio-legacy` plus the older MINIO_*
    # settings in .env; the same minio-data volume and image pin are kept, so an
    # existing volume is read as-is with no data change.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    # The pinned image's entrypoint is /usr/bin/docker-entrypoint.sh and its cmd is
    # `minio`; this service's `command:` overrides the cmd. A blank password would make
    # MinIO fall back to its published minioadmin:minioadmin credentials, so the
    # entrypoint is replaced with a /bin/sh guard that refuses a blank password, the
    # default one, or anything shorter than 8 characters (exit 78, one line on stderr)
    # and otherwise execs the real entrypoint with `"$@"` — the command below. Every
    # `$` is written `$$` (Compose turns it into a literal `$`), and `--` is the
    # placeholder that becomes $0, so `$@` holds exactly the command arguments.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$MINIO_ROOT_PASSWORD" ] || [ "$$MINIO_ROOT_PASSWORD" = minioadmin ] || [ "$${#MINIO_ROOT_PASSWORD}" -lt 8 ]; then
          echo "minio: MINIO_ROOT_PASSWORD is blank, the default minioadmin, or shorter than 8 characters - set a real one in .env (legacy MinIO section of .env.example)" >&2
          exit 78
        fi
        exec /usr/bin/docker-entrypoint.sh "$$@"
      - --
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-crowadmin}
      # Required — set it in .env; see .env.example (legacy MinIO section). The
      # empty-default `:-` form for the same reason as garage: an off profile is still
      # interpolated, and a required `:?` reference would also demand it from a
      # `--profile cloud --profile storage` run. A blank value stops the MinIO
      # container at start through the entrypoint guard above — this is the only
      # profile that reads it.
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-}"
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"   # Console (not exposed in production)
    # API port 9000 is internal-only (accessible to crow-gateway via Docker network)
    expose:
      - "9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: [minio-legacy]

  # Optional: Cloudflare Tunnel for home network access
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      crow-gateway:
        condition: service_healthy
    restart: unless-stopped
    profiles: [local]

volumes:
  garage-meta:
  garage-data:
  minio-data: