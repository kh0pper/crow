name: Bundle Image Freshness Check

# Nightly check that every bundle's docker image still pulls.
# Catches upstream image deletions, repo renames, and tag deprecations.
#
# Reporting contract: scheduled failures update ONE pinned issue instead of
# filing a new issue per night; a passing scheduled run closes it.
# workflow_dispatch runs never touch issues.
#
# That issue is matched by exact title, plus the bundle-image-stale label when
# the repo actually has that label. The repository's own Gitea mirror also reads
# .github/workflows/, and Gitea ignores an unknown `labels:` filter and lists
# pull requests among issues. Neither is trusted — see the note inside the
# reporting steps. The job below is gated to GitHub (Gitea's Docker runner and
# its issue store are not what this check reports to), but the client-side
# filtering stays: it also protects GitHub from a PR or an unrelated issue that
# happens to share the title.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-images:
    # GitHub only: Gitea Actions reads this file too, and a scheduled pull of
    # every bundle image is not something a mirror should run (nor report on).
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract bundle images
        # The script resolves ${VAR:-default} interpolation in image references
        # and skips locally-built (build:) services — a raw grep here reported
        # literal `${VLLM_ROCM_IMAGE}` and local build tags as missing images
        # for months. See the script header for why `docker compose config` is
        # not used (bundles with required install-time env fail it).
        run: |
          set -e
          python3 scripts/extract-bundle-images.py /tmp/images.txt /tmp/parse-failures.txt
          echo "Images to check:"
          cat /tmp/images.txt
          if [ -s /tmp/parse-failures.txt ]; then
            echo "Compose files that failed to parse (their images were NOT checked):"
            cat /tmp/parse-failures.txt
          fi

      - name: Pull each image
        id: pull
        run: |
          set +e
          fail=0
          : > /tmp/missing.txt
          # A compose file that doesn't parse (or an image reference that can't
          # be resolved) means images silently escaped the check — treat that
          # as a failure, not a skip. The lines are already self-describing.
          if [ -s /tmp/parse-failures.txt ]; then
            cat /tmp/parse-failures.txt >> /tmp/missing.txt
            fail=1
          fi
          while IFS= read -r img; do
            [ -z "$img" ] && continue
            echo "::group::Pulling $img"
            if docker pull "$img" >/dev/null 2>&1; then
              echo "OK"
              # Free the layers immediately — the full set (incl. multi-GB
              # vLLM/ROCm images) would exhaust runner disk if accumulated.
              docker rmi "$img" >/dev/null 2>&1 || true
            else
              echo "FAIL"
              echo "$img" >> /tmp/missing.txt
              fail=1
            fi
            echo "::endgroup::"
          done < /tmp/images.txt
          exit $fail

      - name: Update the pinned issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const LABEL = 'bundle-image-stale';
            const TITLE = 'Bundle image-freshness check failed';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Gitea compatibility — never "simplify" this back to a server-side
            // `labels:` filter. This workflow runs on a self-hosted Gitea where
            // the repository has NO labels, and Gitea IGNORES an unknown label
            // filter: listForRepo({ labels: LABEL }) then answers with EVERY open
            // issue AND pull request. Trusting that list (open.data[0]) retitled
            // and overwrote a pull request's body on 2026-11-20. So the answer is
            // filtered client-side and only matched on:
            //   - item.pull_request NOT set: a pull request is never ours;
            //   - title EXACTLY TITLE: a similarly titled issue/PR is left alone;
            //   - the label, whenever the label exists in this repo (see
            //     labelWasPresent: a repo with no labels still gets its one issue).
            const labelName = (l) => (typeof l === 'string' ? l : (l && l.name) || '');
            const hasLabel = (item) => (item.labels || []).some((l) => labelName(l) === LABEL);
            const isPinnedIssue = (item, requireLabel) =>
              !item.pull_request && item.title === TITLE && (!requireLabel || hasLabel(item));

            // Ensure the label exists before filing anything. Returns whether it
            // was already there: an issue created in the same run that first
            // created the label cannot carry it yet, and a repo whose label API
            // refuses gets its issue without the label — both are then matched by
            // exact title + not-a-PR on later runs.
            async function labelWasPresent() {
              try {
                const labels = await github.rest.issues.listLabelsForRepo({ owner, repo, per_page: 100 });
                if ((labels.data || []).some((l) => l && l.name === LABEL)) return { present: true, usable: true };
              } catch (e) {
                core.info('Could not list labels (' + e.message + '); trying to create it.');
              }
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: LABEL,
                  color: 'd73a4a',
                  description: 'The nightly bundle image-freshness check is failing',
                });
                core.info('Created the ' + LABEL + ' label.');
                return { present: false, usable: true };
              } catch (e) {
                core.warning('Could not create the ' + LABEL + ' label (' + e.message + '); filing the issue without it and matching it by exact title from now on.');
                return { present: false, usable: false };
              }
            }

            let list;
            try {
              const missing = fs.readFileSync('/tmp/missing.txt', 'utf8').trim().split('\n').filter(Boolean);
              list = missing.map(m => '- `' + m + '`').join('\n');
            } catch (e) {
              list = '_Could not read the missing list — see workflow logs._';
            }
            const runUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const body = [
              'Nightly image-freshness check failed.',
              '',
              'Images that failed to pull:',
              list,
              '',
              'Last failing run: ' + runUrl,
              'Last checked: ' + new Date().toISOString(),
              '',
              '_This issue is updated in place by every scheduled failure and auto-closes when the check passes again._',
            ].join('\n');

            const label = await labelWasPresent();
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const matches = (open.data || []).filter((item) => isPinnedIssue(item, label.present));
            if (matches.length > 0) {
              // The pinned issue: update in place, never file a second one.
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: matches[0].number,
                title: TITLE,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: TITLE,
                body,
                ...(label.usable ? { labels: [LABEL] } : {}),
              });
            }

      - name: Close the pinned issue on success
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'bundle-image-stale';
            const TITLE = 'Bundle image-freshness check failed';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;

            // Same Gitea caveat as the failure step above: a `labels:` filter is
            // IGNORED when the label does not exist, and the response mixes
            // issues with pull requests — commenting on / closing such a row
            // would hit a PR or an unrelated issue. Filter client-side: never a
            // pull request, exact title, plus the label when the repo has it.
            const labelName = (l) => (typeof l === 'string' ? l : (l && l.name) || '');
            const hasLabel = (item) => (item.labels || []).some((l) => labelName(l) === LABEL);
            const isPinnedIssue = (item, requireLabel) =>
              !item.pull_request && item.title === TITLE && (!requireLabel || hasLabel(item));

            // Read-only: this step never creates the label. Where the repo has no
            // labels (or the label could not be created) the pinned issue was
            // filed under its exact title, so match on that alone.
            let requireLabel = false;
            try {
              const labels = await github.rest.issues.listLabelsForRepo({ owner, repo, per_page: 100 });
              requireLabel = (labels.data || []).some((l) => l && l.name === LABEL);
            } catch (e) {
              core.info('Could not list labels (' + e.message + '); matching the pinned issue by title.');
            }

            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const matches = (open.data || []).filter((item) => isPinnedIssue(item, requireLabel));
            if (matches.length === 0) {
              core.info('No pinned image-freshness issue to close.');
              return;
            }
            for (const issue of matches) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: 'Image-freshness check passed again: ' + runUrl + ' — closing.',
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
