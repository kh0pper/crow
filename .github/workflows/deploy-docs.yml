name: Deploy Docs

# GitHub Pages only. Gitea Actions reads .github/workflows/ too, where the
# `pages` permission, upload-pages-artifact and the github-pages environment do
# not exist and the run fails on every push to main — so every job here is
# gated on github.server_url and simply skips off GitHub.

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/deploy-docs.yml']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install docs dependencies
        run: cd docs && npm ci
      - name: Build docs
        run: cd docs && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    # Stated per job, not just inherited through `needs`: a Pages step must
    # never run on a forge that has no Pages.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
