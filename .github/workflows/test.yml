name: Tests

# The CI floor (arc item A1, 2026-07-18): full suite + repo gates + audit on
# every PR and every push to main — deliberately NO path filters, so a check
# context always exists (path-filtered workflows were why "no check runs" used
# to read as normal here).
#
# ⚠ Job KEYS (suite / static-checks / audit) are load-bearing: branch
# protection requires them as status-check contexts, and GitHub uses the job
# key as the context because these jobs must NOT set a `name:` property.
# Renaming a key requires updating branch protection in the same PR.
#
# CI green does NOT cover schema migrations — SCHEMA_GENERATION bumps still
# require the manual migration rail (scripts/schema-migration-dryrun.sh) on
# live-shaped data before merge.

on:
  pull_request:
  push:
    branches: [main]

# Never cancel a main verification run (two quick merges must both get
# verified); superseded PR pushes are safe to cancel.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # S3 (M7): the pi sandbox tests (tests/pi-sandbox.test.js) need
      # bubblewrap and unprivileged user namespaces. ubuntu-24.04 runners
      # restrict those through AppArmor, so lift that for this throwaway VM.
      # Best effort: if it still cannot work, the sandbox tests self-skip and
      # every other PiRpc test runs unwrapped, exactly as before.
      - name: Enable the pi sandbox (bubblewrap + unprivileged userns)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq bubblewrap || { sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap; }
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if bwrap --dev-bind / / --unshare-user -- /bin/true; then
            echo "pi sandbox available: sandbox tests will run"
          else
            echo "::warning::pi sandbox unavailable on this runner; tests/pi-sandbox.test.js integration cases will skip"
          fi
      # Live layout tests (phone-width checks, Perch @412x730 …) drive a private
      # headless Chrome (tests/fixtures/headless-chrome.mjs), found under
      # ~/.cache/ms-playwright. Pinned: playwright 1.63.0 = Chrome Headless
      # Shell 153.0.8010.12 (build 1243). --with-deps installs its system libs.
      - name: Headless Chrome for the live layout tests
        run: npx --yes playwright@1.63.0 install --with-deps chromium-headless-shell
      # The SunVox engine tests (tests/sunvox-studio.test.js) load the bundle's
      # vendored native library through koffi, which lives in the bundle's own
      # node_modules. Install it with exactly the flags the Extensions page
      # installer uses, so CI also proves that install path loads the engine.
      - name: SunVox Studio bundle deps (engine tests)
        run: npm ci --prefix bundles/sunvox-studio --omit=optional --ignore-scripts --no-audit --no-fund
      # GITHUB_ACTIONS=true applies tests/ci-exclusions.json (empty today);
      # host-bound tests self-skip via in-file capability guards instead.
      # CROW_REQUIRE_TEST_CHROME: a browser that fails to start fails the live
      # tests instead of letting them skip silently.
      # CROW_REQUIRE_SUNVOX_ENGINE: the SunVox engine tests fail instead of
      # skipping when the engine cannot load.
      - run: npm test
        env:
          CROW_REQUIRE_TEST_CHROME: "1"
          CROW_REQUIRE_SUNVOX_ENGINE: "1"

  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # build-registry imports ajv (a devDependency) via lib/bundle-contract —
      # a full npm ci is required (check-port-allocation alone is dep-free).
      - run: npm ci
      - name: Port allocation check
        run: node scripts/check-port-allocation.js
      - name: Registry build check
        run: node scripts/build-registry.mjs --check
      # Every shipped bundle skill's current text must be in the ledger the
      # boot-time skill sync reads (bundles/skill-history.json), and the
      # ledger must stay append-only against the base (the PR's base commit,
      # or the push's previous commit — one shallow fetch of that single
      # commit). Fix with: node scripts/build-skill-history.mjs, then commit
      # the ledger. With no base (a first push), only coverage is checked.
      - name: Skill history check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            node scripts/build-skill-history.mjs --check --base "$BASE_SHA"
          else
            echo "no base commit: append-only check skipped"
            node scripts/build-skill-history.mjs --check
          fi
      # Vendored upstream payloads (bundles/<id>/payload/) must match the
      # payload_sha256 their vendor script stamped. Manifests without that
      # field are skipped by design — that is the pre-vendor draft state.
      - name: Vendored payload digest check
        run: node scripts/check-vendored-payloads.mjs
      # Design kit (bundles/design-kit/lib): every pinned file's sha256, every
      # licence file, exact version pins, no CSS that fetches at runtime, and no
      # remote URL in the kit's code or skills. Fix by re-vendoring:
      # node scripts/design-kit/vendor-lib.mjs
      - name: Design kit library check
        run: node scripts/check-design-kit-lib.mjs
      - run: npm run validate-model-catalog
      # This repo is public: no process documents (specs/plans/handoffs),
      # credentials, or real tailnet hostnames in tracked files. The local
      # personal-token denylist part is skipped here (CI is set).
      - name: Public hygiene check
        run: node scripts/check-public-hygiene.mjs

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Blocking tier: CRITICAL advisories in production deps stop merges.
      # Advisory-red playbook: fix same-day via upgrade or package.json
      # "overrides"; if genuinely unfixable same-day, raise the level in a PR
      # that links a tracking issue. Registry flakes are retried; note npm ci
      # in the suite job shares the same registry dependency anyway.
      - name: npm audit (blocking, critical, production deps)
        # npm exits 1 for vulns AND for many infra errors, so retry every
        # failure: a genuine critical just burns ~60s of retries before the
        # job goes red; a registry blip gets three chances.
        run: |
          for i in 1 2 3; do
            npm audit --omit=dev --audit-level=critical && exit 0
            echo "npm audit failed, retry $i/3"; sleep $((i*10))
          done
          exit 1
      # The vaultwarden bundle carries the Bitwarden CLI, which handles vault credentials
      # (Crow keychain): its own lock file gets the same blocking critical-tier audit.
      - name: npm audit (blocking, critical, vaultwarden bundle production deps)
        run: |
          for i in 1 2 3; do
            npm audit --prefix bundles/vaultwarden --omit=dev --audit-level=critical && exit 0
            echo "npm audit failed, retry $i/3"; sleep $((i*10))
          done
          exit 1
      # The workspace bundle parses untrusted office files (fflate, xmldom, ical.js): its own lock file
      # gets the same blocking critical-tier audit as vaultwarden.
      - name: npm audit (blocking, critical, workspace bundle production deps)
        run: |
          for i in 1 2 3; do
            npm audit --prefix bundles/workspace --omit=dev --audit-level=critical && exit 0
            echo "npm audit failed, retry $i/3"; sleep $((i*10))
          done
          exit 1
      # The design kit renderer parses specs that can come from outside the
      # owner's Crow (vega, mermaid, svgo, puppeteer-core): its own lock file gets
      # the same blocking critical-tier audit.
      - name: npm audit (blocking, critical, design-kit renderer production deps)
        run: |
          for i in 1 2 3; do
            npm audit --prefix bundles/design-kit/renderer --omit=dev --audit-level=critical && exit 0
            echo "npm audit failed, retry $i/3"; sleep $((i*10))
          done
          exit 1
      - name: npm audit (informational, full)
        continue-on-error: true
        run: npm audit || true

  phone-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv run --extra dev pytest -q
        working-directory: bundles/phone/runner
