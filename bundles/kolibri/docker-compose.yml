# Kolibri — offline-first learning platform from Learning Equality.
#
# Pinned to 0.19.5. The image sets KOLIBRI_HOME=/kolibri and its entrypoint refuses to
# start unless /kolibri is a MOUNT — so the data volume is mounted exactly there. It also
# ships python (and no curl or wget), which is what the healthcheck below uses.

services:
  kolibri:
    image: learningequality/kolibri:0.19.5
    container_name: crow-kolibri
    ports:
      - "127.0.0.1:${KOLIBRI_HTTP_PORT:-8041}:8080"
    volumes:
      - ${KOLIBRI_DATA_PATH:-kolibri-data}:/kolibri
    environment:
      - KOLIBRI_HTTP_PORT=8080
      - KOLIBRI_LANG=en
    init: true
    mem_limit: 1500m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8080/api/public/info/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  kolibri-data: