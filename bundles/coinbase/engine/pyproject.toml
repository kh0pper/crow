[project]
name = "crow-coinbase"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["coinbase-advanced-py==1.8.4", "requests", "fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crow_coinbase"]

[tool.pytest.ini_options]
pythonpath = ["src"]