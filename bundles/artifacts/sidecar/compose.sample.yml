# Crow Artifacts — the sidecar Tailscale node. SAMPLE ONLY: copy this file,
# fill in the placeholders, then `docker compose -f compose.sample.yml up -d`.
#
# The artifact origin gets its own hostname from this second Tailscale node: a
# tailscaled in userspace-networking mode (no NET_ADMIN, no /dev/net/tun in
# play) whose Serve config proxies https://${TS_CERT_DOMAIN}:443 to the origin.
#
# IT MUST RUN IN ITS OWN NETWORK NAMESPACE. tailscaled's userspace netstack
# forwards an inbound TCP connection on ANY port of the node's tailnet address
# to 127.0.0.1:<same port> and dials it with a plain Go dialer in the namespace
# the sidecar runs in. Under `network_mode: host` that 127.0.0.1 is THIS
# COMPUTER's loopback, so every loopback port here — the dashboard, an admin
# API, a database — would answer the tailnet. So: never add
# `network_mode: host`, never `network_mode: service:<x>` or
# `network_mode: container:<x>` (those join another container's namespace, and
# a namespace shared with the app container is the same flaw under a different
# name), and never publish a port (this file has none, and the sidecar needs
# none). The bridge below gives it a namespace of its own, and its only way to
# the origin is the bridge gateway IP.
#
# Before the first start:
#   1. Create the EXTERNAL bridge once (compose only attaches to it):
#        docker network create --driver bridge \
#          --subnet 172.30.0.0/24 --gateway 172.30.0.1 \
#          crow-artifacts-sidecar
#      Pick a subnet that collides with neither your LAN nor another Crow
#      instance on this machine.
#   2. Bind the origin to that bridge gateway IP —
#      CROW_ARTIFACT_ORIGIN_BIND=172.30.0.1 — and render
#      bundles/artifacts/sidecar/serve.json.tmpl into ./serve.json beside this
#      file with renderServeConfig(tmpl, { target: "http://172.30.0.1:3090" })
#      (3090 is CROW_ARTIFACT_ORIGIN_PORT here).
#      Host firewall: ONE door, and it only exists because ufw is enabled with
#      default-deny incoming (check `ufw status verbose`) — that is what the
#      design relies on. The rule, scoped to the bridge's own interface
#      (`docker network inspect crow-artifacts-sidecar` names it, br-…), the
#      sidecar IP and that port:
#        ufw allow in on <bridge interface> from 172.30.0.2 to 172.30.0.1 \
#          port 3090 proto tcp
#      Then FENCE the bridge subnet from this machine's private networks
#      (DOCKER-USER; the documented default). ESTABLISHED,RELATED is accepted
#      first, and the origin's own subnet is excluded from the 172.16/12 drop
#      because the origin lives on it:
#        iptables -I DOCKER-USER 1 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
#        iptables -A DOCKER-USER -s 172.30.0.0/24 -d 10.0.0.0/8 -j DROP
#        iptables -A DOCKER-USER -s 172.30.0.0/24 -d 172.16.0.0/12 ! -d 172.30.0.0/24 -j DROP
#        iptables -A DOCKER-USER -s 172.30.0.0/24 -d 192.168.0.0/16 -j DROP
#        iptables -A DOCKER-USER -s 172.30.0.0/24 -d 100.64.0.0/10 -j DROP
#        iptables -A DOCKER-USER -s 172.30.0.0/24 -d 169.254.0.0/16 -j DROP
#      Persist them with a small oneshot unit that re-applies them on every
#      boot (crow-artifacts-fence.service; docs/architecture/artifacts.md has the
#      unit, and the caveat: a fenced sidecar reaches LAN and tailnet peers over
#      DERP instead of a direct path).
#   3. Replace the <pin> below with the real digest
#      (`docker buildx imagetools inspect tailscale/tailscale:<version>`).
#   4. Put TS_AUTHKEY (a SINGLE-USE auth key) in a .env file beside this one.
#
# The gateway must start AFTER docker (After=docker.service): it binds the bridge
# gateway IP above, which does not exist until dockerd creates the bridge. It
# also retries that bind every 5 s for 2 minutes, so a boot that won the race
# recovers on its own.
#
# A household CONTAINER instance needs none of steps 1-2: its sidecar joins that
# instance's compose network and proxies to the origin by container name.
name: crow-artifacts-sidecar

services:
  sidecar:
    # Pinned by digest: a tag would silently upgrade the node on every restart.
    image: tailscale/tailscale@sha256:<pin>
    container_name: crow-artifacts-sidecar
    # The explicit hostname is the node's name; TS_HOSTNAME makes it the
    # MagicDNS name Serve's certificate is issued for.
    hostname: crow-artifacts
    restart: unless-stopped
    environment:
      TS_USERSPACE_NETWORKING: "true"
      TS_HOSTNAME: crow-artifacts
      # Log in once; the node key then lives only in the state volume below.
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/lib/tailscale/tailscaled.sock
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env (a single-use key)}
    volumes:
      # The state directory is a bind mount so the gateway's health check can
      # read the same LocalAPI socket: CROW_ARTIFACT_SIDECAR_SOCKET=./state/tailscaled.sock
      - ./state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    # Userspace networking needs nothing beyond this: drop every capability,
    # then give back only DAC_OVERRIDE. `DAC_OVERRIDE` is what lets root in the
    # container traverse and write the state and socket directories below: they
    # are a bind mount the HOST user owns with mode 0700, and a container user
    # it does not own cannot even traverse them otherwise. Nothing is chowned.
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    networks:
      artifacts-sidecar:
        ipv4_address: 172.30.0.2

networks:
  artifacts-sidecar:
    # EXTERNAL: created once with the command above, never by compose, so its
    # fixed subnet and gateway stay put across `compose down`/`up`.
    external: true
    name: crow-artifacts-sidecar