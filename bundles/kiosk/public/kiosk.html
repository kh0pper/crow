<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Crow Kiosk</title>
<link rel="stylesheet" href="/display/assets/theme.css">
<link rel="stylesheet" href="/display/assets/kiosk.css">
<script src="/display/assets/bird-svg.js"></script>
<script type="module" src="/display/assets/kiosk.js"></script>
</head>
<body>
<main id="app" class="k-app">
  <header class="k-top"><time id="clock" class="k-clock"></time><span id="date" class="k-date"></span><div id="speaker" class="k-spk" hidden></div></header>
  <section class="k-stage">
    <button id="bird" class="k-bird is-idle" type="button">
      <span class="k-ring" aria-hidden="true"></span>
      <span id="bird-art" class="k-bird-art"></span>
      <span class="k-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <div id="windows" class="k-windows" aria-live="polite" hidden></div>
  </section>
  <section id="pairing" class="k-pairing" hidden>
    <p id="pair-label" class="k-pair-label"></p>
    <p id="pair-code" class="k-pair-code"></p>
    <p id="pair-hint" class="k-pair-hint"></p>
  </section>
  <footer id="captions" class="k-captions" aria-live="polite">
    <p id="cap-user" class="k-cap-user"></p>
    <p id="cap-bot" class="k-cap-bot"></p>
  </footer>
  <form id="compose" class="k-compose" hidden>
    <input id="compose-text" type="text" maxlength="500" autocomplete="off" enterkeyhint="send">
    <button id="compose-send" type="submit"></button>
  </form>
  <div class="k-tools">
    <button id="type-btn" type="button"><svg viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h10M7 14h6"/></svg></button>
    <button id="voice-btn" type="button" data-voice="on"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 9h3l5-4v14l-5-4H4zM16 9.5a4 4 0 0 1 0 5"/></svg></button>
  </div>
  <button id="np-chip" class="k-np-chip" type="button" hidden></button>
  <audio id="media" preload="none"></audio>
  <button id="mic" class="k-mic" type="button"></button>
  <div id="banner" class="k-banner" role="status" hidden></div>
  <div id="debug" class="k-debug" hidden></div>
</main>
</body>
</html>
