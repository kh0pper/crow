services:
  llamacpp-vulkan-qwen3-embed:
    image: kyuz0/amd-strix-halo-toolboxes:rocm-7.2.1
    container_name: llamacpp-vulkan-qwen3-embed
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    env_file:
      - ${HOME}/.crow/env/rocm.env
    volumes:
      - ${LLM_CACHE}:/models
    ports:
      - "${CROW_TAILSCALE_IP}:8004:8000"
    entrypoint: ["llama-server"]
    command:
      # Qwen3-Embedding-0.6B Q8_0 GGUF (~640 MB).
      # Pre-download once:
      #   mkdir -p $LLM_CACHE/qwen3-embedding-0.6b/
      #   curl -L \
      #     -o $LLM_CACHE/qwen3-embedding-0.6b/Qwen3-Embedding-0.6B-Q8_0.gguf \
      #     https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
      - -m
      - /models/qwen3-embedding-0.6b/Qwen3-Embedding-0.6B-Q8_0.gguf
      - --alias
      - qwen3-embedding-0.6b
      - --embedding
      # Qwen3-Embedding is trained with LAST-TOKEN (EOS) pooling. Mean pooling runs without
      # error and produces vectors that cannot rank: measured 0/3 top-1 on a 5-doc/3-query
      # retrieval check where the same model with native pooling scored 3/3, with a
      # top1-to-top2 margin of +0.03 against +0.12. Changing this invalidates any index built
      # against the old setting, so re-embed after changing it.
      - --pooling
      - "last"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - -ngl
      - "999"
      - -fa
      - "on"
      - --no-mmap
      # -c is SPLIT across the --parallel slots: 16384 / 4 = 4096 tokens per
      # slot (the same per-slot context as before; the largest real input seen
      # was ~3.5k tokens). 4 slots instead of 8 frees ~1.75 GiB of KV cache;
      # batch indexing jobs queue in two waves instead of one (measured
      # 2026-10-15: 16 concurrent ~2k-token inputs in 1.2 s, identical vectors).
      - -c
      - "16384"
      - --parallel
      - "4"
      # 500-word chunks hit ~650 tokens; raise the physical batch + ubatch
      # so a single chunk fits in one forward pass. 4096 leaves headroom
      # for occasional longer chunks without OOM at 0.6B params.
      - -b
      - "4096"
      - -ub
      - "4096"
    restart: unless-stopped
    # No ipc: host. llama-server is one process and shares no memory with any other, so the
    # host IPC namespace buys nothing (the install security check refuses it without
    # privileged consent). A private /dev/shm of shm_size is kept as headroom.
    shm_size: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
