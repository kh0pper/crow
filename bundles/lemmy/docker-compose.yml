# Lemmy — federated link aggregator + discussion platform.
#
# Four-container bundle: lemmy (backend, Rust) + lemmy-ui (frontend) +
# postgres + pict-rs (image hosting). lemmy + lemmy-ui on crow-federation
# (Caddy reverse-proxies to lemmy-ui:1234); DB + pict-rs on default.
#
# lemmy-ui serves the web app only; it does NOT proxy the API (GET /api/v3/site on
# lemmy-ui answers 404, checked live on 0.19.17). The public site must send /api,
# /pictrs, /feeds, /nodeinfo, /.well-known and ActivityPub requests to lemmy:8536 and
# everything else to lemmy-ui:1234.
#
# Data:
#   volume "postgres"  Postgres data (posts, users, the instance's private keys)
#   volume "pictrs"    pict-rs sled db + media files
#   Both are Docker-managed volumes of this compose project: the images run as their
#   own uids (postgres 70, pict-rs 991), which a host folder created by the Docker
#   daemon as root does not suit, and uninstall with delete data removes both.
#   Lemmy's config is written inside the container at every start (see the entrypoint).
#
# Images: dessalines/lemmy:0.19.17 and dessalines/lemmy-ui:0.19.17 (floats
# within 0.19.x — verify latest + CVE feed at implementation time per the
# plan's image-tag policy).

networks:
  crow-federation:
    external: true
  default:

volumes:
  postgres:
  pictrs:

services:
  postgres:
    image: postgres:16-alpine
    container_name: crow-lemmy-postgres
    networks:
      - default
    environment:
      POSTGRES_USER: lemmy
      POSTGRES_PASSWORD: ${LEMMY_DB_PASSWORD}
      POSTGRES_DB: lemmy
    volumes:
      - postgres:/var/lib/postgresql/data
    init: true
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemmy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pictrs:
    image: asonix/pictrs:0.5.23
    container_name: crow-lemmy-pictrs
    user: "991:991"
    networks:
      - default
    environment:
      PICTRS__SERVER__API_KEY: ${LEMMY_PICTRS_API_KEY}
      # pict-rs 0.5 names (0.4's MEDIA__GIF__* and MEDIA__VIDEO_CODEC are ignored by 0.5)
      PICTRS__MEDIA__VIDEO__VIDEO_CODEC: vp9
      PICTRS__MEDIA__ANIMATION__MAX_WIDTH: "256"
      PICTRS__MEDIA__ANIMATION__MAX_HEIGHT: "256"
      PICTRS__MEDIA__ANIMATION__MAX_AREA: "65536"
      PICTRS__MEDIA__ANIMATION__MAX_FRAME_COUNT: "400"
      RUST_LOG: warn,tracing=warn
      RUST_BACKTRACE: full
    volumes:
      - pictrs:/mnt
    init: true
    mem_limit: 512m
    restart: unless-stopped

  lemmy:
    image: dessalines/lemmy:0.19.17
    container_name: crow-lemmy
    hostname: lemmy
    networks:
      - default
      - crow-federation
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUST_LOG: "warn"
      RUST_BACKTRACE: "full"
      LEMMY_DATABASE_URL: "postgres://lemmy:${LEMMY_DB_PASSWORD}@postgres:5432/lemmy"
      # The image runs as uid 1000 (lemmy) with no writable config folder, so the
      # entrypoint writes the config into the container's own /tmp at every start.
      LEMMY_CONFIG_LOCATION: /tmp/crow-lemmy/config.hjson
      # Secrets reach the entrypoint through the environment and are expanded by its
      # shell ($${...}), so the script text that stays in PID 1's command line (init: true)
      # holds variable names, never values.
      CROW_LEMMY_HOSTNAME: "${LEMMY_HOSTNAME:?LEMMY_HOSTNAME is required}"
      CROW_LEMMY_PICTRS_API_KEY: "${LEMMY_PICTRS_API_KEY}"
      CROW_LEMMY_ADMIN_PASSWORD: "${LEMMY_ADMIN_PASSWORD}"
    # Lemmy 0.19 reads only the keys below (federation on/off, captcha and registration
    # are site settings in Admin -> Settings). tls_enabled: true because Caddy serves
    # https; Lemmy itself still listens on plain http. `setup` is used once, at the
    # first start against an empty database, to create the admin.
    entrypoint:
      - sh
      - -c
      - |
        umask 077
        case "$${CROW_LEMMY_HOSTNAME}" in
          ""|*[!a-z0-9.:-]*|[.:-]*|*[.:-]|*..*) echo "LEMMY_HOSTNAME must be a bare lowercase hostname such as lemmy.example.com (no https://, no path)" >&2; exit 64 ;;
        esac
        mkdir -p /tmp/crow-lemmy
        cat > /tmp/crow-lemmy/config.hjson <<HJSON
        {
          hostname: "$${CROW_LEMMY_HOSTNAME}"
          bind: "0.0.0.0"
          port: 8536
          tls_enabled: true
          pictrs: {
            url: "http://pictrs:8080/"
            api_key: "$${CROW_LEMMY_PICTRS_API_KEY}"
          }
          setup: {
            admin_username: "admin_pending"
            admin_password: "$${CROW_LEMMY_ADMIN_PASSWORD}"
            site_name: "Crow Lemmy"
          }
        }
        HJSON
        exec lemmy_server
    init: true
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8536/api/v3/site || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
      start_interval: 5s

  lemmy-ui:
    image: dessalines/lemmy-ui:0.19.17
    container_name: crow-lemmy-ui
    networks:
      - default
      - crow-federation
    depends_on:
      lemmy:
        condition: service_healthy
    environment:
      LEMMY_UI_LEMMY_INTERNAL_HOST: "lemmy:8536"
      LEMMY_UI_LEMMY_EXTERNAL_HOST: ${LEMMY_HOSTNAME}
      LEMMY_UI_HTTPS: "true"
    init: true
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:1234/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
      start_interval: 5s
