services:
  vllm-rocm-qwen35-4b:
    # vLLM >= 0.21 is required on ROCm: older builds leave the HSA event thread spinning
    # at 100% CPU after the first request (vllm-project/vllm#41964).
    image: ${VLLM_ROCM_IMAGE:-rocm/vllm:rocm7.14.1_rdna_ubuntu24.04_py3.14_pytorch_2.11_vllm_0.23.0}
    container_name: vllm-rocm-qwen35-4b
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    env_file:
      - ${HOME}/.crow/env/rocm.env
    environment:
      HF_HOME: /models
      HUGGING_FACE_HUB_TOKEN: ${VLLM_HF_TOKEN:-}
    volumes:
      - ${LLM_CACHE}:/models
    ports:
      - "${CROW_TAILSCALE_IP}:8011:8000"
    entrypoint: ["vllm", "serve"]
    command:
      - Qwen/Qwen3.5-4B
      - --served-model-name
      - qwen3.5-4b
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --dtype
      - bfloat16
      # 0.105 of the 124 GiB the APU exposes leaves ~3.9 GiB of KV (~100k
      # tokens): ~11x vLLM's max concurrency at 8192, ~1.5x all 8 sequences at
      # full length. The observed peak was ~17k tokens (3 running requests).
      - --gpu-memory-utilization
      - "0.105"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "8"
      - --enable-auto-tool-choice
      # Qwen3.5 emits XML-style tool calls (<tool_call><function=NAME><parameter=KEY>…)
      # which the `hermes` parser (expects <tool_call>{json}</tool_call>) cannot parse —
      # it leaves tool calls as raw text, swallowed entirely in streaming mode, so the
      # voice/companion turn produces no content and no tool call (silent "choke").
      # `qwen3_xml` is the matching parser for this model's format. Verified by feeding
      # the model's exact output to each parser offline (2026-06-14).
      - --tool-call-parser
      - qwen3_xml
      - --enforce-eager
      # Prefill in 2048-token chunks. The PyTorch caching allocator keeps every
      # activation segment it ever allocated, sized by the chunk; with the
      # default (max-model-len) the 4b grew ~6 GiB beyond vLLM's own budget
      # over days of mixed-length traffic. Smaller chunks are EXPECTED to cap
      # that growth (under observation; a one-hour test cannot show it).
      # Classifier latency is unchanged (p50 0.18 s). Never set VLLM_LOGGING_LEVEL=DEBUG here: it made
      # requests ~33x slower in the same test.
      - --max-num-batched-tokens
      - "2048"
      # Text-only. Qwen3.5-4B is natively vision-language, but its ViT encoder's
      # worst-case multimodal profiling (preprocessor longest_edge=16.7M px →
      # ~65k ViT patches → a 65k² attention matrix) triggers a 256 GiB HIP OOM on
      # gfx1151 (no flash-attn ViT kernel on ROCm). Disabling image/video input
      # skips that profiling so the text tower serves. Vision-bearing turns route
      # to the multimodal 35B (crow-chat, llama.cpp Vulkan) or grackle-vision.
      - --limit-mm-per-prompt
      - '{"image":0,"video":0}'
    restart: unless-stopped
    # No ipc: host. vLLM's API server and engine core share memory INSIDE this one
    # container, which its own IPC namespace and a private /dev/shm of shm_size cover; the
    # host IPC namespace would only matter for sharing with other containers (none). The
    # install security check refuses ipc: host without privileged consent.
    shm_size: 8g
