services:
  frigate:
    # Pinned to the release tag AND the digest of the build in use (security audit
    # N7-1): the registry's 0.18.2 tag resolves to this exact digest, so a tag
    # re-point upstream cannot silently upgrade an installed Frigate.
    image: ghcr.io/blakeblackshear/frigate:0.18.2@sha256:fd60f99ffd4eb6c42360ed4e14953e270586f239309ab3983e55b2e97ffac09a
    container_name: crow-frigate
    ports:
      # Authenticated UI + REST API — exposed on loopback; proxied through Crow gateway routes.js
      - "127.0.0.1:8971:8971"
      # RTSP restreamer (cameras pull from this for multi-consumer restreaming)
      - "127.0.0.1:8554:8554"
      # WebRTC (low-latency live view). Both TCP and UDP. Loopback only, like every
      # other Crow port: other devices watch through the authenticated UI above.
      - "127.0.0.1:8555:8555/tcp"
      - "127.0.0.1:8555:8555/udp"
      # Port 5000 (internal unauthenticated API) intentionally NOT published — would bypass auth.
    volumes:
      - ${FRIGATE_CONFIG_PATH:-frigate-config}:/config
      - ${FRIGATE_MEDIA_PATH:-frigate-media}:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      # HTTP/2 off (CVE-2026-123007, CVE-2026-123633): Frigate's image ships `http2 on;`
      # in a static nginx.conf, so its plain-HTTP listener accepts cleartext HTTP/2. This
      # s6-overlay legacy cont-init hook (from this bundle's own folder, read-only) rewrites
      # that before nginx starts. Frigate needs no HTTP/2; a later version removes the hook.
      - ./cont-init/10-crow-http2-off:/etc/cont-init.d/10-crow-http2-off:ro
    environment:
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD:-}
    shm_size: "512mb"
    mem_limit: 4g
    # NOTE: init: true breaks Frigate — its s6-overlay supervisor must run as PID 1.
    restart: unless-stopped
    # Frigate reports healthy only once the detector has initialized and at least one frame has been processed
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5000/api/stats > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  frigate-config:
  frigate-media:
