## LocalAI — OpenAI-compatible local AI server
##
## Usage:
##   docker compose up -d
##   # Models are downloaded on first use via the API
##   # Or pre-download: docker compose exec localai local-ai models install llama3.2
##
## GPU passthrough (NVIDIA):
##   Uncomment the deploy section below and install nvidia-container-toolkit

services:
  localai:
    # `latest-cpu` was frozen upstream (nothing newer was published to it), and
    # newer releases ship no plain `-cpu` tag: the unsuffixed release tag IS the
    # CPU image (`-aio-cpu` is the all-in-one variant, a different image).
    image: localai/localai:v3.12.1@sha256:558efc7610e2ce43e702eaed4fcf456102a416471929d99819ef251fdbbf8b51
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - localai-models:/build/models
    environment:
      - THREADS=4
      - CONTEXT_SIZE=2048
    restart: unless-stopped
    # For NVIDIA GPU support, swap the image for the same release's CUDA variant
    # (a versioned, digest-pinned tag — never a rolling `latest-*` one) and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  localai-models:
