services:
  kokoro-tts:
    # Pinned (kiosk K1, 2026-10-03): v0.9.0 == the floating latest tag on that date (sha256:ee3111d6…).
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.0
    container_name: kokoro-tts
    mem_limit: 4g
    environment:
      USE_GPU: "false"
      DEVICE: cpu
    # Loopback-only: TTS is an internal service reached by the gateway / companion
    # over localhost (companion is host-networked) and by the glasses via the
    # gateway. Never published on the tailnet or LAN (network-exposure invariant).
    ports:
      - "127.0.0.1:8880:8880"
    restart: unless-stopped
