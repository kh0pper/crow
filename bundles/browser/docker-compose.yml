# Compose project name. Without it the project defaults to the directory name,
# "browser", for EVERY instance, so a second instance's `compose up/down` would
# act on the first one's project. A co-hosted instance must already set
# CROW_BROWSER_CONTAINER_NAME (see container_name below), so the project follows
# it; the primary keeps "browser". COMPOSE_PROJECT_NAME / `-p` still override.
# The value must be a valid project name: lowercase letters, digits, - and _.
# Never run this file with another instance's `-p`: the project decides which
# container is replaced. (The profile volume's explicit name below follows
# CROW_BROWSER_CONTAINER_NAME from THIS bundle's .env, and the profile carries
# an instance marker the entrypoint checks, so a wrong -p cannot open another
# instance's logins; it would still replace that instance's container.)
name: ${CROW_BROWSER_CONTAINER_NAME:-browser}
services:
  crow-browser:
    build:
      context: .
      dockerfile: Dockerfile
    # Overridable so a second Crow instance on the same host (distinct
    # CROW_HOME) can run its own browser container side-by-side. With
    # network_mode: host the ports must be overridden too — set
    # CROW_BROWSER_{VNC,CDP}_PORT in this bundle's .env alongside the name.
    container_name: ${CROW_BROWSER_CONTAINER_NAME:-crow-browser}
    network_mode: host
    environment:
      # Since 1.3.12 Xvfb listens on no abstract socket (those are scoped to the
      # network namespace, the host's here) and needs a per-start cookie, so
      # co-hosted instances no longer collide on a display number. Distinct
      # numbers are still the safe default while an older instance runs.
      - DISPLAY_NUM=${CROW_BROWSER_DISPLAY:-99}
      # Which Crow instance this container and its profile belong to (the
      # entrypoint checks the profile's marker against it).
      - CROW_INSTANCE=${CROW_HOME:?CROW_HOME is required}
      - CDP_PORT=${CROW_BROWSER_CDP_PORT:-9222}
      - NOVNC_PORT=${CROW_BROWSER_VNC_PORT:-6080}
      - CHROME_PROXY=${CROW_BROWSER_PROXY:-}
    volumes:
      # No default: a second instance whose CROW_HOME is unset must fail here rather
      # than silently mount the primary's downloads directory into its container.
      - ${CROW_HOME:?CROW_HOME is required so each instance writes downloads to its own directory}/browser-downloads:/downloads
      # The Chromium profile (cookies, saved logins) on a NAMED volume, so a
      # rebuild or a recreate (Configure → Restart, a proxy_url relaunch,
      # `compose down`/`up`) keeps it. Its name is explicit and per instance
      # (`browser-chromium-profile` on the primary,
      # `<CROW_BROWSER_CONTAINER_NAME>-chromium-profile` on a co-hosted one),
      # from this bundle's .env, not from `-p`. An install from before 1.3.12 keeps its profile inside
      # the old container until it is moved, once, with
      # scripts/ops/browser-profile-to-volume.sh (never run automatically).
      # `docker compose down -v` deletes the volume, and with it every login.
      - chromium-profile:/root/.config/chromium-crow
    # No VNC password prompt (browser 1.3.12). RFB is a unix socket inside the
    # container; noVNC (127.0.0.1 only) reaches it only with the per-instance
    # token, which the Crow gateway adds server-side behind the dashboard
    # sign-in. Compose copies it in as a 0400 root-only file (not an env var,
    # so not in `docker inspect`). An old .env's VNC password line is harmless:
    # it is simply not passed any more. After changing the token in .env,
    # recreate the container (the gateway reads the new one on every upgrade).
    configs:
      - source: vnc_token
        target: /run/secrets/crow-vnc-token
        mode: 0400
    init: true
    # Chromium gets SIGTERM (the entrypoint forwards it) and time to flush
    # cookies and logins to the profile before anything is killed.
    stop_grace_period: 30s
    mem_limit: 2g
    shm_size: 1g
    restart: unless-stopped

volumes:
  chromium-profile:
    name: ${CROW_BROWSER_CONTAINER_NAME:-browser}-chromium-profile

configs:
  vnc_token:
    content: ${CROW_BROWSER_VNC_TOKEN:?CROW_BROWSER_VNC_TOKEN is required (Crow generates it at install)}
