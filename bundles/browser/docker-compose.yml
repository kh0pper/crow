services:
  crow-browser:
    build:
      context: .
      dockerfile: Dockerfile
    # Overridable so a second Crow instance on the same host (distinct
    # CROW_HOME) can run its own browser container side-by-side. With
    # network_mode: host the ports must be overridden too — set
    # CROW_BROWSER_{VNC,RFB,CDP}_PORT in this bundle's .env alongside the name.
    container_name: ${CROW_BROWSER_CONTAINER_NAME:-crow-browser}
    network_mode: host
    environment:
      # Abstract X sockets (@/tmp/.X11-unix/XNN) are scoped to the NETWORK
      # namespace, which network_mode:host shares — so a second instance left on
      # :99 collides with the first, its Xvfb dies with "Cannot establish any
      # listening sockets", and x11vnc silently attaches to the FIRST instance's
      # display. Give each co-hosted instance its own number. Proven 2026-08-09.
      - DISPLAY_NUM=${CROW_BROWSER_DISPLAY:-99}
      - VNC_PASSWORD=${CROW_BROWSER_VNC_PASSWORD:?VNC password is required}
      - CDP_PORT=${CROW_BROWSER_CDP_PORT:-9222}
      - NOVNC_PORT=${CROW_BROWSER_VNC_PORT:-6080}
      - RFB_PORT=${CROW_BROWSER_RFB_PORT:-5900}
      - CHROME_PROXY=${CROW_BROWSER_PROXY:-}
    volumes:
      # No default: a second instance whose CROW_HOME is unset must fail here rather
      # than silently mount the primary's downloads directory into its container.
      - ${CROW_HOME:?CROW_HOME is required so each instance writes downloads to its own directory}/browser-downloads:/downloads
    init: true
    mem_limit: 2g
    shm_size: 1g
    restart: unless-stopped
