services:
  llamacpp-vulkan-qwen3-vl-4b:
    # Dedicated vision model: Qwen3-VL-4B-Instruct (Apache-2.0) Q8_0 + its F16
    # vision projector, served by llama.cpp (Vulkan/RADV) on Strix Halo gfx1151.
    # It answers the Meta Glasses "what am I looking at?" turn and any other
    # vision-profile consumer, so it stays loaded (restart: unless-stopped).
    #
    # It is deliberately OUTSIDE every VRAM mutex group: it never evicts the
    # resident chat model and the chat model's swaps never stop it. Budget:
    # ~7-8 GiB of the unified pool at -c 8192 / -np 1 with images capped at
    # --image-max-tokens 1024 (a full-resolution phone photo is downscaled by
    # llama-server to fit, instead of filling the context).
    #
    # Same image as the resident chat bundle (llamacpp-vulkan-qwen36-35b-a3b),
    # which already serves a model with --mmproj on this hardware.
    #
    # Pre-download once into $LLM_CACHE/qwen3-vl-4b-instruct/ from
    # unsloth/Qwen3-VL-4B-Instruct-GGUF and check the sha256 (these are the
    # model catalog's pinned files, so a later catalog conversion can adopt
    # them in place):
    #   Qwen3-VL-4B-Instruct-Q8_0.gguf  e30b41d2f2cc48149dfbba1b3fb2c023c7e6bf2def75833d4d43820df75efeb3
    #   mmproj-F16.gguf                 1b9f4e92f0fbda14d7d7b58baed86039b8a980fe503d9d6a9393f25c0028f1fc
    #   base=https://huggingface.co/unsloth/Qwen3-VL-4B-Instruct-GGUF/resolve/main
    #   mkdir -p $LLM_CACHE/qwen3-vl-4b-instruct && cd $LLM_CACHE/qwen3-vl-4b-instruct
    #   curl -L -O $base/Qwen3-VL-4B-Instruct-Q8_0.gguf && curl -L -O $base/mmproj-F16.gguf
    #   sha256sum Qwen3-VL-4B-Instruct-Q8_0.gguf mmproj-F16.gguf
    image: kyuz0/amd-strix-halo-toolboxes:vulkan-radv-mtp
    container_name: llamacpp-vulkan-qwen3-vl-4b
    # Vulkan needs only the DRM render node (no /dev/kfd: no ROCm/HIP compute
    # queues, so it adds nothing to the host's KFD queue budget).
    devices:
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    # Same host env file as the other GPU bundles: `crow bundle install` links it as this
    # bundle's .env, which supplies VIDEO_GID / RENDER_GID / LLM_CACHE above.
    env_file:
      - ${HOME}/.crow/env/rocm.env
    volumes:
      - ${LLM_CACHE}/qwen3-vl-4b-instruct:/models/qwen3-vl-4b-instruct:ro
    # Loopback only: every consumer is this host's gateway.
    ports:
      - "127.0.0.1:8012:8000"
    entrypoint: ["llama-server"]
    command:
      - -m
      - /models/qwen3-vl-4b-instruct/Qwen3-VL-4B-Instruct-Q8_0.gguf
      - --mmproj
      - /models/qwen3-vl-4b-instruct/mmproj-F16.gguf
      - --alias
      - qwen3-vl-4b-instruct
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - -ngl
      - "999"
      - -fa
      - "on"
      - --no-mmap
      # One photo (<= 1024 image tokens) + a one-line question + a short
      # spoken answer fit easily in 8192; one slot, the glasses ask one at a time.
      - -c
      - "8192"
      - -np
      - "1"
      - --image-max-tokens
      - "1024"
      - --jinja
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
