# WirePlumber (kiosk user): run the Bluetooth monitor regardless of logind seat state.
# Verified on the bench (headless user session): without this WirePlumber did not create the A2DP sink.
# Under cage the kiosk user has an active seat, but the seat is inactive for a moment whenever cage
# restarts; keeping the monitor seat-independent avoids dropping the speaker at that moment.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
