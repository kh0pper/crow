# Crow kiosk runtime dir. The agent (kiosk group) may only write the pre-created request file; it cannot
# create, replace or link files in the root-owned directory. The state file is readable by everyone.
d /run/crow-kiosk 0755 root root -
f /run/crow-kiosk/bt-recover.request 0620 root kiosk -
f /run/crow-kiosk/bt-recover.state 0644 root root -
