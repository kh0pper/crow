# WirePlumber (kiosk user): do not pin a stream to the device it used last time. Chromium opened its
# output before the Bluetooth sink existed, WirePlumber stored the headphone jack as its target and kept
# restoring it even after the speaker became the default. With restore-target off, streams follow the
# default sink (linking.follow-default-target, on by default).
wireplumber.settings = {
  node.stream.restore-target = false
}
